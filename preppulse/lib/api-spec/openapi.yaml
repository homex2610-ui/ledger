openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: prep
    description: Preparation tracking operations
  - name: study
    description: Focus sessions and tasks
  - name: recall
    description: Spaced-repetition recall deck
  - name: community
    description: Circles and groups
  - name: shares
    description: Share artifacts, referral attribution, and the sharing funnel
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Sign out the current session
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the signed-in user and profile
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not signed in

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password recovery email
      description: Always returns success for a well-formed email to avoid leaking account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Recovery email sent (or account not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid email
        "503":
          description: Recovery service unavailable
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a recovery token
      description: Verifies the recovery access token, provisions the account if needed and signs the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password set and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired token, or weak password
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Set or change the signed-in user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Current password is incorrect
        "401":
          description: Not signed in

  /auth/oauth/providers:
    get:
      operationId: getAuthOauthProviders
      tags: [auth]
      summary: List OAuth providers with availability and connection state
      responses:
        "200":
          description: Provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersResponse"

  /auth/google:
    post:
      operationId: googleAuth
      tags: [auth]
      summary: Exchange a Google Identity Services ID token for a session
      description: >
        Verifies the GIS ID token against Google's JWKS (aud, iss, exp, signature),
        then logs in or creates a local account for the verified Google identity.
        A CSRF token must be supplied that matches the g_csrf_token cookie set by GIS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthInput"
      responses:
        "200":
          description: Signed in with an existing OAuth identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "201":
          description: New local account created from the Google identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid, expired, or CSRF-mismatched credential
        "409":
          description: Email matches an existing non-linked account (account_linking_required)

  /auth/oauth/link:
    post:
      operationId: oauthLink
      tags: [auth]
      summary: Link an OAuth identity to the signed-in account
      description: >
        Requires an authenticated session. Explicit account linking only -
        never merges accounts by matching email alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkInput"
      responses:
        "200":
          description: Identity linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid credential or CSRF mismatch
        "401":
          description: Not signed in
        "409":
          description: Identity already linked to another account

  /auth/discord/authorize:
    get:
      operationId: getAuthDiscordAuthorize
      tags: [auth]
      summary: Build the Discord OAuth2 authorization URL
      parameters:
        - name: link
          in: query
          required: false
          description: When true, requires a session and links instead of signing in
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthAuthorizeResponse"
        "400":
          description: Discord OAuth is not configured
        "401":
          description: link=true requested without a session

  /auth/discord/callback:
    get:
      operationId: discordAuthCallback
      tags: [auth]
      summary: Discord OAuth2 callback (browser redirect flow)
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects back to the SPA with an oauth result parameter
        "400":
          description: Missing or mismatched state, or exchange failure

  /auth/oauth/{provider}:
    delete:
      operationId: disconnectOauthProvider
      tags: [auth]
      summary: Disconnect an OAuth provider from the signed-in account
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, discord]
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not signed in
        "409":
          description: Refused - would leave the account with no sign-in method


  /dashboard:
    get:
      operationId: getDashboard
      tags: [prep]
      summary: Get the current preparation dashboard
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA timezone used for streak and daily activity day boundaries
          schema:
            type: string
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /topics:
    get:
      operationId: listTopics
      tags: [prep]
      summary: List syllabus topics with progress
      responses:
        "200":
          description: Syllabus topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
  /topics/{topicId}/progress:
    patch:
      operationId: updateTopicProgress
      tags: [prep]
      summary: Update a topic's preparation status
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicProgressInput"
      responses:
        "200":
          description: Updated topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /syllabus/summary:
    get:
      operationId: getSyllabusSummary
      tags: [prep]
      summary: Weightage-aware syllabus coverage summary
      responses:
        "200":
          description: Coverage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyllabusSummary"
  /tests:
    get:
      operationId: listTestAttempts
      tags: [prep]
      summary: List mock test attempts
      responses:
        "200":
          description: Mock test attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestAttempt"
    post:
      operationId: createTestAttempt
      tags: [prep]
      summary: Log a mock test attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAttemptInput"
      responses:
        "201":
          description: Logged mock test attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAttempt"
  /tests/{id}:
    patch:
      operationId: updateTestAttempt
      tags: [prep]
      summary: Update a logged mock test attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestAttemptUpdateInput"
      responses:
        "200":
          description: Updated mock test attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAttempt"
        "404":
          description: Attempt not found
    delete:
      operationId: deleteTestAttempt
      tags: [prep]
      summary: Delete a logged mock test attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Attempt not found
  /tests/analyze:
    get:
      operationId: analyzeTestAttempts
      tags: [prep]
      summary: Performance trend, subject averages and weak areas
      responses:
        "200":
          description: Analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAnalysis"
  /study-sessions:
    get:
      operationId: listStudySessions
      tags: [prep]
      summary: List study session history
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySession"
    post:
      operationId: createStudySession
      tags: [prep]
      summary: Log a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Logged study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySession"
  /focus-sessions:
    get:
      operationId: listFocusSessions
      tags: [study]
      summary: List focus sessions
      responses:
        "200":
          description: Focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FocusSession"
    post:
      operationId: createFocusSession
      tags: [study]
      summary: Start a timed focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Started focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /focus-sessions/{focusSessionId}:
    patch:
      operationId: updateFocusSession
      tags: [study]
      summary: Complete or abandon a focus session
      parameters:
        - name: focusSessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionUpdate"
      responses:
        "200":
          description: Updated focus session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSession"
  /tasks:
    get:
      operationId: listTasks
      tags: [study]
      summary: List tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [study]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [study]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [study]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /cards:
    get:
      operationId: listCards
      tags: [recall]
      summary: List recall cards
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      operationId: createCard
      tags: [recall]
      summary: Add a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Added card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
  /cards/stats:
    get:
      operationId: getCardStats
      tags: [recall]
      summary: Deck statistics
      responses:
        "200":
          description: Deck statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardStats"
  /cards/{cardId}:
    patch:
      operationId: updateCard
      tags: [recall]
      summary: Update a card
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
    delete:
      operationId: deleteCard
      tags: [recall]
      summary: Delete a card
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /cards/{cardId}/review:
    post:
      operationId: reviewCard
      tags: [recall]
      summary: Grade a card review (SM-2 scheduling)
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardReviewInput"
      responses:
        "200":
          description: Rescheduled card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /profile:
    get:
      operationId: getProfile
      tags: [prep]
      summary: Get the current learner profile
      responses:
        "200":
          description: Learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [prep]
      summary: Update profile preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated learner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /me/export:
    get:
      operationId: exportMyData
      tags: [prep]
      summary: Download a JSON export of everything the signed-in user owns
      responses:
        "200":
          description: Complete data export for the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportMyData"
  /me:
    delete:
      operationId: deleteMyAccount
      tags: [prep]
      summary: Permanently delete the signed-in account and all of its data
      responses:
        "204":
          description: Account deleted

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [community]
      summary: Get the current weekly circle leaderboard
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA timezone used for weekly and streak day boundaries
          schema:
            type: string
      responses:
        "200":
          description: Weekly leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
  /circles:
    get:
      operationId: getCircles
      tags: [community]
      summary: List circle connections with weekly activity
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA timezone used for connection streaks
          schema:
            type: string
      responses:
        "200":
          description: Circle connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CirclesResponse"
  /circles/connect:
    post:
      operationId: connectByCode
      tags: [community]
      summary: Connect to a peer using their profile code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircleConnectInput"
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleMember"
        "400":
          description: The code is your own code
        "404":
          description: No user with that code
        "409":
          description: Connection rejected because a circle is full (25-member limit)
  /circles/feed:
    get:
      operationId: getCircleFeed
      tags: [community]
      summary: Recent activity from circle connections
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleFeedItem"
  /circles/{userId}:
    delete:
      operationId: removeConnection
      tags: [community]
      summary: Remove a circle connection
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /cohorts:
    get:
      operationId: getCohorts
      tags: [community]
      summary: Get my auto-assigned study cohort
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA timezone used for member streaks
          schema:
            type: string
      responses:
        "200":
          description: My study cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortResponse"
        "404":
          description: No cohort assigned yet
  /cohorts/leaderboard:
    get:
      operationId: getCohortsLeaderboard
      tags: [community]
      summary: Weekly pulse leaderboard for my study cohort
      responses:
        "200":
          description: Cohort leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "404":
          description: No cohort assigned yet
  /cohorts/feed:
    get:
      operationId: getCohortsFeed
      tags: [community]
      summary: Recent activity from my study cohort
      responses:
        "200":
          description: Cohort activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircleFeedItem"
        "404":
          description: No cohort assigned yet

  /groups:
    get:
      operationId: listGroups
      tags: [community]
      summary: List the groups I belong to
      responses:
        "200":
          description: My groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
    post:
      operationId: createGroup
      tags: [community]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
  /groups/join:
    post:
      operationId: joinGroupByCode
      tags: [community]
      summary: Join a group using its invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupJoinInput"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "404":
          description: No group with that code
  /groups/discover:
    get:
      operationId: discoverGroups
      tags: [community]
      summary: Search discoverable groups by name
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Discoverable groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [community]
      summary: Get group details and roster
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "404":
          description: Group not found or not a member
    patch:
      operationId: updateGroup
      tags: [community]
      summary: Update a group (owner only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
    delete:
      operationId: deleteGroup
      tags: [community]
      summary: Delete a group (owner only)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /groups/{groupId}/leave:
    post:
      operationId: leaveGroup
      tags: [community]
      summary: Leave a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Left
  /groups/{groupId}/leaderboard:
    get:
      operationId: getGroupLeaderboard
      tags: [community]
      summary: Weekly pulse leaderboard for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupLeaderboard"
        "404":
          description: Group not found or not a member
  /groups/{groupId}/activity:
    get:
      operationId: getGroupActivity
      tags: [community]
      summary: Per-member daily minutes for the last week
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupActivityItem"
        "404":
          description: Group not found or not a member

  /stats:
    get:
      operationId: getStats
      tags: [prep]
      summary: Aggregated study stats for the Stats page
      parameters:
        - name: tz
          in: query
          required: false
          description: IANA timezone used for calendar-day bucketing
          schema:
            type: string
        - name: weekStart
          in: query
          required: false
          description: Monday (YYYY-MM-DD) of the week to show in Study trends
          schema:
            type: string
            format: date
        - name: month
          in: query
          required: false
          description: YYYY-MM month to show in the focus heatmap
          schema:
            type: string
        - name: subjectsPeriod
          in: query
          required: false
          description: Period for the subject breakdown
          schema:
            type: string
            enum: [week, all]
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /announcements/active:
    get:
      operationId: getActiveAnnouncement
      tags: [announcements]
      summary: The currently active announcement for the signed-in user, or null when none or dismissed
      responses:
        "200":
          description: Active announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveAnnouncementResponse"

  /announcements/{announcementId}/dismiss:
    post:
      operationId: dismissAnnouncement
      tags: [announcements]
      summary: Dismiss an announcement for the current user (stored server-side, applies across devices)
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dismissed

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Read-only admin dashboard aggregates
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsResponse"
        "404":
          description: Not an admin

  /admin/announcements:
    get:
      operationId: listAdminAnnouncements
      tags: [admin]
      summary: All announcements including disabled ones
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
        "404":
          description: Not an admin
    post:
      operationId: createAnnouncement
      tags: [admin]
      summary: Create an announcement (starts disabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Not an admin

  /admin/announcements/{announcementId}:
    patch:
      operationId: updateAnnouncement
      tags: [admin]
      summary: Edit an announcement's fields
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Not an admin or not found

  /admin/announcements/{announcementId}/toggle:
    post:
      operationId: toggleAnnouncement
      tags: [admin]
      summary: Enable or disable an announcement (enabling swaps the active one in one transaction)
      parameters:
        - name: announcementId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementToggle"
      responses:
        "204":
          description: Toggled
        "404":
          description: Not an admin or not found
        "409":
          description: Concurrent change detected - someone else enabled another announcement, refresh and retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cohorts:
    get:
      operationId: listAdminCohorts
      tags: [admin]
      summary: All cohorts with member counts
      responses:
        "200":
          description: Cohorts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCohortSummary"
        "404":
          description: Not an admin

  /admin/cohorts/{cohortId}:
    get:
      operationId: getAdminCohort
      tags: [admin]
      summary: A cohort with its members
      parameters:
        - name: cohortId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCohortDetail"
        "404":
          description: Not an admin or not found

  /admin/cohorts/members/{userId}/move:
    post:
      operationId: moveCohortMember
      tags: [admin]
      summary: Move a user to another cohort (admin-only, capacity-checked)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohortMemberMove"
      responses:
        "204":
          description: Moved
        "404":
          description: Not an admin, user not in a cohort, or cohort not found
        "409":
          description: Target cohort is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search users by handle or email
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserSummary"
        "404":
          description: Not an admin

  /admin/users/export:
    get:
      operationId: listAdminUsersExport
      tags: [admin]
      summary: All users with lifetime totals, for CSV export
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersExport"
        "404":
          description: Not an admin

  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Full detail for one user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: Not an admin or not found

  /admin/users/{userId}/set-admin:
    post:
      operationId: setAdmin
      tags: [admin]
      summary: Promote or demote a user (last-admin demotion is blocked in the database)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSet"
      responses:
        "204":
          description: Updated
        "404":
          description: Not an admin or not found
        "409":
          description: Cannot remove the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{userId}/remove:
    post:
      operationId: removeAdminUser
      tags: [admin]
      summary: Remove a user and all their data (cascades). Their sign-in provider stays; a fresh sign-in re-creates the account.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          description: Not an admin or not found
        "409":
          description: Cannot remove yourself or the last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares:
    post:
      operationId: createShare
      tags: [shares]
      summary: Create a Daily Focus share artifact from today's real study data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareInput"
      responses:
        "201":
          description: Created share artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareArtifact"
        "400":
          description: Not eligible (fewer than 25 focused minutes today) or invalid visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Share creation rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/events:
    post:
      operationId: recordSharePromptEvent
      tags: [shares]
      summary: Record an owner-side share funnel event (prompt viewed or clicked)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharePromptEventInput"
      responses:
        "204":
          description: Recorded
        "429":
          description: Event rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{shareId}:
    get:
      operationId: getShare
      tags: [shares]
      summary: Resolve a public share artifact
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public share artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareArtifact"
        "404":
          description: Not found, not public, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{shareId}/events:
    post:
      operationId: recordShareOpenEvent
      tags: [shares]
      summary: Record a share link open (fired by the share page)
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareOpenEventInput"
      responses:
        "204":
          description: Recorded
        "429":
          description: Event rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /shares/{shareId}/attribution:
    post:
      operationId: createReferralAttribution
      tags: [shares]
      summary: Attribute the signed-in account to a share's inviter (fired after signup/login)
      parameters:
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Attribution created
        "400":
          description: Self-referral rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Share not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account already attributed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        handle:
          type: string
        hasPassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, handle, createdAt]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        profile:
          $ref: "#/components/schemas/Profile"
      required: [user, profile]
    SignupInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        handle:
          type: string
          minLength: 2
      required: [email, password]
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    ForgotPasswordInput:
      type: object
      properties:
        email:
          type: string
      required: [email]
    ResetPasswordInput:
      type: object
      properties:
        accessToken:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [accessToken, newPassword]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required: [newPassword]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    OAuthProviderInfo:
      type: object
      properties:
        enabled:
          type: boolean
        clientId:
          type: string
        connected:
          type: boolean
      required: [enabled, connected]
    OAuthProvidersResponse:
      type: object
      properties:
        google:
          $ref: "#/components/schemas/OAuthProviderInfo"
        discord:
          $ref: "#/components/schemas/OAuthProviderInfo"
      required: [google, discord]
    GoogleAuthInput:
      type: object
      properties:
        credential:
          type: string
        csrfToken:
          type: string
      required: [credential, csrfToken]
    OAuthLinkInput:
      type: object
      properties:
        provider:
          type: string
          enum: [google]
        credential:
          type: string
        csrfToken:
          type: string
      required: [provider, credential, csrfToken]
    OAuthAuthorizeResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]


    Profile:
      type: object
      properties:
        handle:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        examTrack:
          type: string
          enum: [jee_main, neet]
        stage:
          type: string
          enum: [class_11, class_12, dropper]
        targetYear:
          type: number
        examDate:
          type: string
          format: date
          nullable: true
        dailyGoalMinutes:
          type: number
        weeklyGoalMinutes:
          type: number
        focusMode:
          type: boolean
        showOnLeaderboard:
          type: boolean
        isAdmin:
          type: boolean
        profileCode:
          type: string
      required: [handle, email, avatarUrl, examTrack, stage, targetYear, examDate, dailyGoalMinutes, weeklyGoalMinutes, focusMode, showOnLeaderboard, isAdmin, profileCode]

    ExportGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        inviteCode:
          type: string
        isDiscoverable:
          type: boolean
        memberCount:
          type: number
        createdAt:
          type: string
          format: date-time
      required: [id, name, inviteCode, isDiscoverable, memberCount, createdAt]
    ExportGroupMembership:
      type: object
      properties:
        groupId:
          type: string
        groupName:
          type: string
        role:
          type: string
        joinedAt:
          type: string
          format: date-time
      required: [groupId, groupName, role, joinedAt]
    ExportConnection:
      type: object
      properties:
        userId:
          type: string
        handle:
          type: string
        avatarUrl:
          type: string
          nullable: true
        connectedAt:
          type: string
          format: date-time
      required: [userId, handle, avatarUrl, connectedAt]
    ExportMyData:
      type: object
      properties:
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/Profile"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        studySessions:
          type: array
          items:
            $ref: "#/components/schemas/StudySession"
        focusSessions:
          type: array
          items:
            $ref: "#/components/schemas/FocusSession"
        testAttempts:
          type: array
          items:
            $ref: "#/components/schemas/TestAttempt"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        ownedGroups:
          type: array
          items:
            $ref: "#/components/schemas/ExportGroup"
        groupMemberships:
          type: array
          items:
            $ref: "#/components/schemas/ExportGroupMembership"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/ExportConnection"
      required: [exportedAt, profile, topics, cards, studySessions, focusSessions, testAttempts, tasks, ownedGroups, groupMemberships, connections]
    ProfileUpdate:
      type: object
      properties:
        handle:
          type: string
          minLength: 2
        examTrack:
          type: string
          enum: [jee_main, neet]
        stage:
          type: string
          enum: [class_11, class_12, dropper]
        targetYear:
          type: number
        examDate:
          type: string
          format: date
          nullable: true
        dailyGoalMinutes:
          type: number
          minimum: 1
        weeklyGoalMinutes:
          type: number
          minimum: 1
        focusMode:
          type: boolean
        showOnLeaderboard:
          type: boolean

    TestAttemptUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        exam:
          type: string
          enum: [jee_main, jee_adv, neet]
        subject:
          type: string
          nullable: true
        subjectScores:
          allOf:
            - $ref: "#/components/schemas/SubjectScores"
          nullable: true
        score:
          type: number
          minimum: 0
        maxScore:
          type: number
          minimum: 1
        attempted:
          type: number
          minimum: 0
        totalQuestions:
          type: number
          minimum: 1
        timeMinutes:
          type: number
          minimum: 1
        negativeMarksLost:
          type: number
          minimum: 0

    Topic:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        chapter:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [not_started, learning, practiced, revised, mastered]
        weightage:
          type: string
          enum: [high, medium, low]
        accuracy:
          type: number
        questionCount:
          type: number
        prerequisites:
          type: array
          items:
            type: string
        locked:
          type: boolean
      required: [id, subject, chapter, name, status, weightage, accuracy, questionCount, prerequisites, locked]
    TopicProgressInput:
      type: object
      properties:
        status:
          type: string
          enum: [not_started, learning, practiced, revised, mastered]
      required: [status]
    SubjectCoverage:
      type: object
      properties:
        subject:
          type: string
        total:
          type: number
        mastered:
          type: number
        percent:
          type: number
        weightagePercent:
          type: number
      required: [subject, total, mastered, percent, weightagePercent]
    SyllabusSummary:
      type: object
      properties:
        totalTopics:
          type: number
        masteredTopics:
          type: number
        inProgressTopics:
          type: number
        syllabusPercent:
          type: number
        weightagePercent:
          type: number
        bySubject:
          type: array
          items:
            $ref: "#/components/schemas/SubjectCoverage"
      required: [totalTopics, masteredTopics, inProgressTopics, syllabusPercent, weightagePercent, bySubject]

    SubjectScores:
      type: object
      additionalProperties: false
      properties:
        physics:
          type: number
          minimum: 0
        chemistry:
          type: number
          minimum: 0
        mathematics:
          type: number
          minimum: 0
        biology:
          type: number
          minimum: 0
    TestAttempt:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        exam:
          type: string
          enum: [jee_main, jee_adv, neet]
        subject:
          type: string
          nullable: true
        subjectScores:
          allOf:
            - $ref: "#/components/schemas/SubjectScores"
          nullable: true
        date:
          type: string
          format: date-time
        score:
          type: number
        maxScore:
          type: number
        accuracy:
          type: number
        attempted:
          type: number
        totalQuestions:
          type: number
        timeMinutes:
          type: number
        negativeMarksLost:
          type: number
        weakAreas:
          type: array
          items:
            type: string
      required: [id, name, exam, subject, subjectScores, date, score, maxScore, accuracy, attempted, totalQuestions, timeMinutes, negativeMarksLost, weakAreas]
    TestAttemptInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        exam:
          type: string
          enum: [jee_main, jee_adv, neet]
        subject:
          type: string
          nullable: true
        subjectScores:
          allOf:
            - $ref: "#/components/schemas/SubjectScores"
          nullable: true
        score:
          type: number
          minimum: 0
        maxScore:
          type: number
          minimum: 1
        attempted:
          type: number
          minimum: 0
        totalQuestions:
          type: number
          minimum: 1
        timeMinutes:
          type: number
          minimum: 1
        negativeMarksLost:
          type: number
          minimum: 0
      required: [name, exam, score, maxScore, attempted, totalQuestions, timeMinutes, negativeMarksLost]
    TestTrendPoint:
      type: object
      properties:
        date:
          type: string
          format: date-time
        name:
          type: string
        accuracy:
          type: number
      required: [date, name, accuracy]
    SubjectAverage:
      type: object
      properties:
        subject:
          type: string
        averageAccuracy:
          type: number
        attempts:
          type: number
      required: [subject, averageAccuracy, attempts]
    WeakAreaCount:
      type: object
      properties:
        name:
          type: string
        count:
          type: number
      required: [name, count]
    TestAnalysis:
      type: object
      properties:
        totalAttempts:
          type: number
        averageAccuracy:
          type: number
        bestAccuracy:
          type: number
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TestTrendPoint"
        subjectAverages:
          type: array
          items:
            $ref: "#/components/schemas/SubjectAverage"
        weakAreas:
          type: array
          items:
            $ref: "#/components/schemas/WeakAreaCount"
      required: [totalAttempts, averageAccuracy, bestAccuracy, trend, subjectAverages, weakAreas]

    StudySession:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        minutes:
          type: number
        source:
          type: string
          enum: [manual, timer]
        createdAt:
          type: string
          format: date-time
      required: [id, subject, minutes, source, createdAt]
    StudySessionInput:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
        minutes:
          type: number
          minimum: 1
          maximum: 600
        source:
          type: string
          enum: [manual, timer]
      required: [subject, minutes, source]

    ShareArtifact:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [daily_focus]
        variant:
          type: string
          enum: [A, B]
        payload:
          type: object
          properties:
            type:
              type: string
              enum: [daily_focus]
            displayName:
              type: string
            minutes:
              type: number
            minutesLabel:
              type: string
            streak:
              type: number
            subjects:
              type: array
              items:
                type: object
                properties:
                  subject:
                    type: string
                  minutes:
                    type: number
                  percent:
                    type: number
                required: [subject, minutes, percent]
            dayLabel:
              type: string
            createdAt:
              type: string
              format: date-time
          required: [type, displayName, minutes, minutesLabel, streak, subjects, dayLabel, createdAt]
        createdAt:
          type: string
          format: date-time
        shareUrl:
          type: string
